name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Never build in the template repository itself — only in repositories
    # created from it (that is where a real plugin release happens). Without
    # this, every push to the template's main branch runs a pointless build.
    if: github.repository != 'ReelVault/ReelVault.PluginTemplate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # postinstall links reelvault-sdk from here — the schema step and the UI
      # build import the SDK vocabulary during the build.
      - name: Check out the server SDK sources
        uses: actions/checkout@v4
        with:
          repository: ReelVault/ReelVault.Server
          ref: main
          path: server

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The SDK link points at server/sdk, whose exports resolve into the
      # tsdown-built dist/ — git-ignored, so it must be produced here.
      - name: Build the server SDK
        run: cd server && bun install --frozen-lockfile && bun run build-sdk

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run check-types

      - name: Build plugin package
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: dist/*.zip

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
